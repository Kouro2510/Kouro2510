<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Le Thanh Phuong — Full-Stack Developer">
  <defs>
    <radialGradient id="glow" cx="78%" cy="12%" r="70%">
      <stop offset="0" stop-color="#ff5a36" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#ff5a36" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f3f0ea" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="#09090b"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="19.5" fill="none" stroke="#f3f0ea" stroke-opacity="0.1"/>

  <!-- status pill -->
  <rect x="56" y="44" width="292" height="36" rx="18" fill="#111114" stroke="#f3f0ea" stroke-opacity="0.12"/>
  <circle cx="78" cy="62" r="5" fill="#6ff2c0">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="78" cy="62" r="5" fill="none" stroke="#6ff2c0">
    <animate attributeName="r" values="5;11" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="94" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6" fill="#f3f0ea" fill-opacity="0.9">OPEN TO FULL-STACK ROLES</text>

  <!-- name -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="92" letter-spacing="-3">
    <text x="50" y="176" fill="#f3f0ea">LE THANH</text>
    <text x="50" y="262" fill="#ff5a36">PHUONG</text>
  </g>

  <!-- role line -->
  <text x="56" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <tspan fill="#8f8c86">// </tspan><tspan fill="#6ff2c0">Full-Stack Developer · Ho Chi Minh City</tspan>
  </text>

  <!-- terminal card -->
  <rect x="680" y="44" width="464" height="272" rx="14" fill="#111114" stroke="#f3f0ea" stroke-opacity="0.12"/>
  <line x1="680" y1="80" x2="1144" y2="80" stroke="#f3f0ea" stroke-opacity="0.08"/>
  <circle cx="702" cy="62" r="5" fill="#ff5a36"/>
  <circle cx="720" cy="62" r="5" fill="#f3f0ea" fill-opacity="0.25"/>
  <circle cx="738" cy="62" r="5" fill="#f3f0ea" fill-opacity="0.25"/>
  <text x="1124" y="66" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8f8c86">~/kouro2510</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="704" y="116"><tspan fill="#ff5a36">$ </tspan><tspan fill="#f3f0ea">whoami</tspan></text>
    <text x="704" y="141" fill="#8f8c86">full-stack dev, schema → cluster</text>
    <text x="704" y="174"><tspan fill="#ff5a36">$ </tspan><tspan fill="#f3f0ea">cat stack.txt</tspan></text>
    <text x="704" y="199" fill="#8f8c86">nestjs laravel next.js flutter k8s</text>
    <text x="704" y="232"><tspan fill="#ff5a36">$ </tspan><tspan fill="#f3f0ea">uptime --career</tspan></text>
    <text x="704" y="257" fill="#6ff2c0">4 yrs · 15+ services · 2 wearables</text>
    <text x="704" y="290"><tspan fill="#ff5a36">$ </tspan></text>
  </g>
  <rect x="724" y="277" width="9" height="17" fill="#f3f0ea">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
